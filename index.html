<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>便利店冰櫃 · CONVENIENCE ICE</title>
<style>
  :root {
    --bg: #0b1220; --panel: #121a2b; --border: rgba(100,180,255,0.18);
    --accent: #3b82f6; --accent2: #22d3ee; --text: #e2e8f0; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); user-select: none;
  }
  .topbar {
    height: 52px; background: linear-gradient(180deg,#0f172a,#0b1220);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; gap: 10px; z-index: 100; position: relative;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
  .brand-icon {
    width: 28px; height: 28px; background: linear-gradient(135deg,#3b82f6,#06b6d4);
    border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .brand small { display: block; font-size: 0.65rem; font-weight: 500; color: var(--muted); }
  .top-center { display: flex; align-items: center; gap: 14px; flex: 1; justify-content: center; }
  .stat-pill {
    background: rgba(30,41,59,0.8); border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 12px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .stat-pill .val { color: var(--accent2); font-weight: 700; font-variant-numeric: tabular-nums; }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .btn-sm {
    background: rgba(30,41,59,0.9); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 6px 12px; font-size: 0.75rem; cursor: pointer;
  }
  .btn-sm.primary { background: linear-gradient(135deg,#2563eb,#0891b2); border: none; color: #fff; }
  select.diff-select {
    background: rgba(30,41,59,0.9); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 6px 8px; font-size: 0.75rem; outline: none;
  }
  .main { display: flex; height: calc(100% - 52px); }
  .sidebar {
    width: 270px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 14px; gap: 14px; overflow-y: auto; flex-shrink: 0;
  }
  .side-section-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .target-card {
    background: linear-gradient(160deg,#1e293b,#0f172a); border: 1px solid rgba(59,130,246,0.4);
    border-radius: 14px; padding: 14px; text-align: center; position: relative;
  }
  .target-badge {
    position: absolute; top: 10px; right: 10px; background: #f59e0b; color: #000;
    font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 8px;
  }
  .target-visual {
    width: 100px; height: 150px; margin: 4px auto 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .target-visual img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5)); }
  .target-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
  .target-desc { font-size: 0.7rem; color: var(--muted); line-height: 1.45; text-align: left; }
  .tips { background: rgba(15,23,42,0.6); border-radius: 12px; padding: 12px; }
  .tips li { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; list-style: none; display: flex; gap: 8px; }
  .tips li span { color: var(--accent2); }
  .tool-btns { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  .tool-btn {
    background: rgba(30,41,59,0.8); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; color: var(--text); font-size: 0.78rem; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tool-btn .count { background: rgba(59,130,246,0.25); color: var(--accent2); font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
  .freezer-wrap { flex: 1; position: relative; overflow: hidden; background: #070d18; }
  .freezer {
    width: 100%; height: 100%; position: relative;
    background-image: linear-gradient(rgba(30,58,100,0.15) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(30,58,100,0.15) 1px, transparent 1px);
    background-size: 48px 48px; overflow: hidden;
  }
  .ice-item {
    position: absolute; cursor: grab; transition: filter 0.15s; will-change: transform;
    touch-action: none; display: flex; align-items: center; justify-content: center;
  }
  .ice-item:active { cursor: grabbing; }
  .ice-item img {
    max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.5));
  }
  .ice-item.dragging { z-index: 50 !important; filter: brightness(1.12); }
  .ice-item.dragging img { filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); }
  .ice-item.found { animation: foundGlow 0.8s ease; z-index: 60 !important; }
  @keyframes foundGlow {
    0% { filter: brightness(1); }
    40% { filter: brightness(1.5); transform: scale(1.28); }
    100% { filter: brightness(1.15); }
  }
  .ice-item.wrong { animation: wrongShake 0.4s; }
  @keyframes wrongShake {
    0%,100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); }
    20% { transform: translate(calc(var(--tx) - 6px), var(--ty)) rotate(var(--rot)); }
    40% { transform: translate(calc(var(--tx) + 6px), var(--ty)) rotate(var(--rot)); }
    60% { transform: translate(calc(var(--tx) - 4px), var(--ty)) rotate(var(--rot)); }
    80% { transform: translate(calc(var(--tx) + 4px), var(--ty)) rotate(var(--rot)); }
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(7,13,24,0.88);
    display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; }
  .overlay-card {
    background: #121a2b; border: 1px solid var(--border); border-radius: 20px;
    padding: 32px 28px; text-align: center; max-width: 360px; width: 90%;
  }
  .overlay-card h2 { font-size: 1.6rem; margin-bottom: 8px; }
  .overlay-card h2.win { color: #22d3ee; }
  .overlay-card h2.lose { color: #f87171; }
  .overlay-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
  .overlay-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    background: linear-gradient(135deg,#2563eb,#0891b2); color: #fff; border: none;
    border-radius: 12px; padding: 12px 24px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .top-center { gap: 8px; }
    .stat-pill { padding: 4px 8px; font-size: 0.72rem; }
    .brand span, .brand small { display: none; }
  }
  .mobile-hint {
    display: none; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.94); border: 1px solid var(--border); border-radius: 16px;
    padding: 10px 16px; z-index: 80; align-items: center; gap: 12px; max-width: 92%;
  }
  @media (max-width: 720px) { .mobile-hint { display: flex; } }
  .mobile-hint .mini-target { width: 36px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .mobile-hint .mini-target img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .mobile-hint .hint-text { font-size: 0.75rem; line-height: 1.3; }
  .mobile-hint .hint-text strong { color: var(--accent2); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">❄</div>
    <div><div>便利店冰櫃</div><small>CONVENIENCE ICE</small></div>
  </div>
  <div class="top-center">
    <div class="stat-pill">⏱ 時間 <span class="val" id="timer">00:45.00</span></div>
    <div class="stat-pill">🔄 翻找數 <span class="val" id="flips">0</span></div>
  </div>
  <div class="top-right">
    <select class="diff-select" id="diff-select">
      <option value="easy">簡單 (100 枝)</option>
      <option value="normal">標準 (220 枝)</option>
      <option value="hard" selected>超塞 (400 枝)</option>
    </select>
    <button class="btn-sm primary" id="reset-btn">↻ 重整理冰櫃</button>
  </div>
</div>
<div class="main">
  <aside class="sidebar">
    <div>
      <div class="side-section-title">本月主打冷飲</div>
      <div class="target-card">
        <div class="target-badge">超人氣棒冰</div>
        <div class="target-visual" id="sidebar-target"></div>
        <div class="target-name" id="target-name">POWER CAP</div>
        <div class="target-desc" id="target-desc">真實 Binggrae 產品照片，找出指定的 Power Cap！</div>
      </div>
    </div>
    <div class="tips">
      <div class="side-section-title">操作技巧</div>
      <ul>
        <li><span>👆</span> 拖開雪糕 — 按住並拖拽撥開</li>
        <li><span>🖱</span> 點擊目標 — 找到後點選確認</li>
        <li><span>❄</span> 冷氣雷達 — 顯示目標大概位置</li>
        <li><span>💡</span> 微弱提示 — 推開附近雜物</li>
      </ul>
    </div>
    <div class="tool-btns">
      <button class="tool-btn" id="radar-btn">
        <span>❄ 冷氣熱點探測</span>
        <span class="count" id="radar-count">3 次可用</span>
      </button>
      <button class="tool-btn" id="hint-btn">
        <span>💡 微弱提示</span>
        <span class="count">推開附近雜物</span>
      </button>
    </div>
  </aside>
  <div class="freezer-wrap">
    <div class="freezer" id="freezer"></div>
    <div class="mobile-hint">
      <div class="mini-target" id="mobile-target"></div>
      <div class="hint-text">找出 <strong id="mobile-label">POWER CAP</strong><br>拖開其他雪糕來找</div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="result-title">找到了！</h2>
    <p id="result-msg"></p>
    <div class="overlay-btns">
      <button class="btn" id="again-btn">再玩一局</button>
      <button class="btn ghost" id="close-overlay">查看冰櫃</button>
    </div>
  </div>
</div>

const DIFF = {
  easy:   { count: 100, time: 60 },
  normal: { count: 220, time: 50 },
  hard:   { count: 400, time: 40 }
};
const POWERCAPS = ALL_PRODUCTS.filter(p => p.kind === 'powercap');
const OTHERS = ALL_PRODUCTS.filter(p => p.kind !== 'powercap');

let items = [];
let targetId = null;
let targetProduct = null;
let flips = 0;
let timeLeft = 45;
let timerInterval = null;
let gameActive = false;
let radarLeft = 3;
let startTime = 0;
let dragItem = null;
let dragOffsetX = 0, dragOffsetY = 0;

const freezer = document.getElementById('freezer');
const timerEl = document.getElementById('timer');
const flipsEl = document.getElementById('flips');
const overlay = document.getElementById('overlay');
const radarCountEl = document.getElementById('radar-count');

function createItemElement(item) {
  const el = document.createElement('div');
  el.className = 'ice-item';
  el.dataset.id = item.id;
  el.style.width = item.w + 'px';
  el.style.height = item.h + 'px';
  el.style.left = '0';
  el.style.top = '0';
  el.style.transform = 'translate(' + item.x + 'px,' + item.y + 'px) rotate(' + item.rot + 'deg)';
  el.style.setProperty('--tx', item.x + 'px');
  el.style.setProperty('--ty', item.y + 'px');
  el.style.setProperty('--rot', item.rot + 'deg');
  el.style.zIndex = item.z;
  const img = document.createElement('img');
  img.src = item.src;
  img.alt = item.label || '';
  img.draggable = false;
  el.appendChild(img);
  el.addEventListener('pointerdown', onItemPointerDown);
  return el;
}

function generateLevel() {
  const diff = document.getElementById('diff-select').value;
  const conf = DIFF[diff];
  timeLeft = conf.time;
  flips = 0;
  radarLeft = 3;
  radarCountEl.textContent = radarLeft + ' 次可用';
  flipsEl.textContent = '0';
  updateTimerDisplay();

  // Random Power Cap as target
  targetProduct = POWERCAPS[Math.floor(Math.random() * POWERCAPS.length)];
  targetId = 'target-' + Date.now();

  document.getElementById('sidebar-target').innerHTML = '<img src="' + targetProduct.src + '" alt="">';
  document.getElementById('target-name').textContent = targetProduct.label;
  document.getElementById('target-desc').textContent = '真實 Binggrae 產品照片。在滿滿的雪糕堆中找出「' + targetProduct.label + '」！';
  document.getElementById('mobile-target').innerHTML = '<img src="' + targetProduct.src + '" alt="">';
  document.getElementById('mobile-label').textContent = targetProduct.label;

  const areaW = Math.max(freezer.clientWidth || 800, 800);
  const areaH = Math.max(freezer.clientHeight || 600, 600);
  items = [];

  // Target
  const scaleT = 0.9 + Math.random() * 0.3;
  items.push({
    id: targetId,
    src: targetProduct.src,
    label: targetProduct.label,
    x: 40 + Math.random() * (areaW - 100),
    y: 40 + Math.random() * (areaH - 140),
    rot: (Math.random() - 0.5) * 40,
    z: 15 + Math.floor(Math.random() * 15),
    w: targetProduct.w * scaleT,
    h: targetProduct.h * scaleT,
    isTarget: true
  });

  // All other products as distractors (including other Power Caps)
  const pool = ALL_PRODUCTS.filter(p => p.id !== targetProduct.id);
  for (let i = 1; i < conf.count; i++) {
    const p = pool[Math.floor(Math.random() * pool.length)];
    const scale = 0.75 + Math.random() * 0.45;
    items.push({
      id: 'item-' + i,
      src: p.src,
      label: p.label,
      x: 10 + Math.random() * (areaW - 90),
      y: 10 + Math.random() * (areaH - 90),
      rot: (Math.random() - 0.5) * 60,
      z: 3 + Math.floor(Math.random() * 40),
      w: p.w * scale,
      h: p.h * scale,
      isTarget: false
    });
  }

  freezer.innerHTML = '';
  items.sort((a, b) => a.z - b.z);
  items.forEach(item => freezer.appendChild(createItemElement(item)));

  gameActive = true;
  startTime = performance.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 50);
  overlay.classList.remove('show');
}

function tick() {
  if (!gameActive) return;
  const elapsed = (performance.now() - startTime) / 1000;
  const conf = DIFF[document.getElementById('diff-select').value];
  timeLeft = Math.max(0, conf.time - elapsed);
  updateTimerDisplay();
  if (timeLeft <= 0) endGame(false);
}

function updateTimerDisplay() {
  const t = Math.max(0, timeLeft);
  const sec = Math.floor(t);
  const ms = Math.floor((t - sec) * 100);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  timerEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + String(ms).padStart(2,'0');
  timerEl.style.color = t < 10 ? '#f87171' : '';
}

function onItemPointerDown(e) {
  if (!gameActive) return;
  e.preventDefault();
  e.stopPropagation();
  const el = e.currentTarget;
  const id = el.dataset.id;
  const item = items.find(i => i.id === id);
  if (!item) return;
  item.z = 100;
  el.style.zIndex = 100;
  dragItem = { el, item, id };
  const rect = el.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  el.classList.add('dragging');
  el.setPointerCapture(e.pointerId);
  flips++;
  flipsEl.textContent = flips;
  el.addEventListener('pointermove', onItemPointerMove);
  el.addEventListener('pointerup', onItemPointerUp);
  el.addEventListener('pointercancel', onItemPointerUp);
}

function onItemPointerMove(e) {
  if (!dragItem) return;
  e.preventDefault();
  const parentRect = freezer.getBoundingClientRect();
  const x = e.clientX - parentRect.left - dragOffsetX;
  const y = e.clientY - parentRect.top - dragOffsetY;
  dragItem.item.x = x;
  dragItem.item.y = y;
  dragItem.el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + dragItem.item.rot + 'deg)';
  dragItem.el.style.setProperty('--tx', x + 'px');
  dragItem.el.style.setProperty('--ty', y + 'px');
}

function onItemPointerUp(e) {
  if (!dragItem) return;
  const { el, item } = dragItem;
  el.classList.remove('dragging');
  try { el.releasePointerCapture(e.pointerId); } catch (_) {}
  el.removeEventListener('pointermove', onItemPointerMove);
  el.removeEventListener('pointerup', onItemPointerUp);
  el.removeEventListener('pointercancel', onItemPointerUp);
  if (item.isTarget) {
    el.classList.add('found');
    endGame(true);
  } else {
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 400);
  }
  dragItem = null;
}

document.getElementById('radar-btn').addEventListener('click', () => {
  if (!gameActive || radarLeft <= 0) return;
  radarLeft--;
  radarCountEl.textContent = radarLeft + ' 次可用';
  const targetItem = items.find(i => i.isTarget);
  if (!targetItem) return;
  const pulse = document.createElement('div');
  pulse.style.cssText = 'position:absolute;left:' + (targetItem.x-50) + 'px;top:' + (targetItem.y-50) + 'px;width:160px;height:160px;border-radius:50%;border:2px solid #22d3ee;background:rgba(34,211,238,0.12);pointer-events:none;z-index:90;animation:radarPulse 1.3s ease-out forwards;';
  if (!document.getElementById('radar-style')) {
    const style = document.createElement('style');
    style.id = 'radar-style';
    style.textContent = '@keyframes radarPulse{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.7);opacity:0}}';
    document.head.appendChild(style);
  }
  freezer.appendChild(pulse);
  setTimeout(() => pulse.remove(), 1400);
});

document.getElementById('hint-btn').addEventListener('click', () => {
  if (!gameActive) return;
  const targetItem = items.find(i => i.isTarget);
  if (!targetItem) return;
  items.forEach(it => {
    if (it.isTarget) return;
    const dx = it.x - targetItem.x;
    const dy = it.y - targetItem.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 130 && dist > 5) {
      const force = (130 - dist) / 130 * 36;
      it.x += (dx / dist) * force;
      it.y += (dy / dist) * force;
      const el = freezer.querySelector('[data-id="' + it.id + '"]');
      if (el) {
        el.style.transition = 'transform 0.45s ease';
        el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px) rotate(' + it.rot + 'deg)';
        el.style.setProperty('--tx', it.x + 'px');
        el.style.setProperty('--ty', it.y + 'px');
        setTimeout(() => el.style.transition = '', 500);
      }
    }
  });
});

function endGame(won) {
  gameActive = false;
  clearInterval(timerInterval);
  const title = document.getElementById('result-title');
  const msg = document.getElementById('result-msg');
  if (won) {
    title.textContent = '🎉 找到了！';
    title.className = 'win';
    const used = DIFF[document.getElementById('diff-select').value].time - timeLeft;
    msg.innerHTML = '成功找出 <strong style="color:#22d3ee">' + targetProduct.label + '</strong><br>用時 ' + used.toFixed(1) + ' 秒 · 翻找 ' + flips + ' 次';
  } else {
    title.textContent = '⏰ 時間到';
    title.className = 'lose';
    msg.innerHTML = '沒能在時間內找到 <strong style="color:#f87171">' + targetProduct.label + '</strong><br>共翻找了 ' + flips + ' 次，再試一次吧！';
  }
  overlay.classList.add('show');
}

document.getElementById('reset-btn').addEventListener('click', generateLevel);
document.getElementById('again-btn').addEventListener('click', generateLevel);
document.getElementById('close-overlay').addEventListener('click', () => overlay.classList.remove('show'));
document.getElementById('diff-select').addEventListener('change', generateLevel);
window.addEventListener('load', () => setTimeout(generateLevel, 80));
</script>
</body>
